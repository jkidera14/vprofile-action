name: vprofile actions
on: workflow_dispatch
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: vprofileapp
  EKS_CLUSTER: vprofile-eks

jobs:
  Testing:
    runs-on: ubuntu-latest
    steps:
      # Checkout Source Code
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run Maven Tests
      - name: Maven test
        run: mvn clean test

      - name: Checkstyle
        run: mvn checkstyle:checkstyle

      # Setup Java 21 to be default (sonar=scanner requirement as of 5.x)
      - name: Set Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin # Always See the Supported distributions for Available Hosting
          java-version: "21"
          cache: maven

      # Verify the Java Version
      - name: Verify Java
        run: java -version

      # Generate JaCoCo Report
      - name: JaCoCo Report
        run: mvn jacoco:report

      # Setup sonar-scanner
      - name: Setup SonarQube
        uses: warchant/setup-sonar-scanner@v10

      # Run SonarCloud Analysis
      - name: SonarQube Scan
        run: |
          sonar-scanner \
          -Dsonar.host.url=${{ secrets.SONAR_URL }} \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
          -Dsonar.organization=${{ secrets.SONAR_ACTION_ORGANIZATION }} \
          -Dsonar.projectKey=${{ secrets.SONAR_ACTION_PROJECT_KEY }} \
          -Dsonar.sources=src/ \
          -Dsonar.junit.reportPaths=target/surefire-reports/ \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
          -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml \
          -Dsonar.java.binaries=target/classes

      # Check the Quality Gate status
      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        # Force to Fail step after specific time
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }} #OPTIONAL

  BUILD_AND_PUSH:
    needs: Testing
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Build & Upload Image to ECR
        uses: appleboy/docker-ecr-action@master
        with:
          access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          registry: ${{ secrets.REGISTRY }}
          repo: ${{ secrets.ECR_REPOSITORY }}
          region: ${{ secrets.AWS_REGION }}
          tag: latest,${{ github.run_number }}
          daemon_off: false
          dockerfile: ./Dockerfile
          context: ./
